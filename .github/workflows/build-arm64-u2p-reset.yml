# build-arm64-u2p-reset.yml —— 给 conaco66/linux-5.15.y 用的一次性内核构建
#
# 放置位置：内核仓库的 `.github/workflows/build-arm64-u2p-reset.yml`
# 配套文件（都要放进内核仓库）：
#   1) `naoyun-u2p-reset.patch`      ← 本仓库 `docs/kernel-patches/dwc3-meson-g12a-u2p-reset.patch` 原样改名放到仓库根
#   2) `naoyun-kernel-config-seed`   ← 本仓库 `docs/kernel-patches/config-seed-5.15.145-conaco66.txt`（盒子现役 /boot/config 原样回传，作种子 .config）
# 触发：Actions 页面 "Build kernel with u2p_reset" → Run workflow → localversion 填 `-naoyun1`
# 产物：artifact `naoyun-kernel-<run>` 里 `naoyun-kernel-artifact.tar`（含 Image / dtb / 完整模块树）+ sha256
#
# 为什么要拿盒子现役 config 作种子：`CONFIG_USB_DWC3_MESON_G12A`、`CONFIG_PHY_MESON_G12A_USB2`、
# `CONFIG_USB_DWC2`、`CONFIG_USB_XHCI_PLATFORM` 全是 =y（编在 Image 里），而
# `CONFIG_USB_LIBCOMPOSITE`/`CONFIG_USB_F_HID`/`CONFIG_USB_CONFIGFS` 是 =m；换一种切法
# 就会和我们在用的 `usb_f_hid`(补丁版 v4)、`naoyun_motion` 的 ABI 期望不一致。
# 种子直接来自现网，构建出来的版本串是 `5.15.145<localversion>`（=y 的部分才能改到）。

name: Build kernel with u2p_reset
on:
  push:
    branches:
      - 'naoyun/**'          # 推分支即开编：本机没有 API 凭据，workflow_dispatch 需要网页点，push 触发不需要
  workflow_dispatch:
    inputs:
      localversion:
        description: "版本后缀（禁止再填 -conaco66：同名会让 /lib/modules、linux-headers 与补丁版 usb_f_hid.ko 的按版本对号集体指到旧树）"
        required: false
        default: "-naoyun1"

env:
  KERNEL_LOCALVERSION: ${{ github.event.inputs.localversion || '-naoyun1' }}

jobs:
  build:
    runs-on: ubuntu-22.04          # 与现网构建同代：Ubuntu clang 14 / LLD 14（CONFIG_CLANG_VERSION=140000）
    steps:
      - uses: actions/checkout@v4

      - name: 工具链（clang/lld/llvm 要有不带版本号的名字）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm clang-14 lld-14 llvm-14 build-essential bc bison flex \
            libelf-dev libssl-dev dwarves kmod rsync \
            device-tree-compiler gcc-aarch64-linux-gnu
          echo "clang=$(command -v clang) ld.lld=$(command -v ld.lld)"
          clang --version | head -1

      - name: 用盒子现役 config 作种子
        run: |
          test -f naoyun-kernel-config-seed
          cp naoyun-kernel-config-seed .config
          # 上一次就死在这里（exit 2）：内核 5.15 的 Makefile 在 LLVM=1 时会把 HOSTCC 也指向
          # `clang`（不带版本号），而只装 clang-14 的机器上没有 /usr/bin/clang ⇒ 连 kconfig
          # 的宿主工具都编不出来。所以这里既装不带版本号的包，也显式把 HOSTCC/CC 钉死。
          if ! make ARCH=arm64 HOSTCC=clang CC=clang LD=ld.lld LLVM=1 olddefconfig; then
            echo "olddefconfig 失败，末 40 行进 job summary"
            make ARCH=arm64 HOSTCC=clang CC=clang LD=ld.lld LLVM=1 olddefconfig 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG_THIN|USB_DWC3_MESON_G12A|PHY_MESON_G12A_USB2)=' .config || true

      - name: 校验补丁已在树里（分支带的是已应用的改动；万一没有就现场应用）
        run: |
          if grep -q "u2p_reset" drivers/usb/dwc3/dwc3-meson-g12a.c; then
            echo "源码里已有 u2p_reset"
          else
            test -f naoyun-u2p-reset.patch
            git apply -v -p1 naoyun-u2p-reset.patch
          fi
          grep -n "DEVICE_ATTR_WO(u2p_reset)" drivers/usb/dwc3/dwc3-meson-g12a.c

      - name: 编译 Image + modules + dtbs
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
               LOCALVERSION="$KERNEL_LOCALVERSION" -j"$(nproc)" \
               Image modules dtbs

      - name: 装模块树
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
               LOCALVERSION="$KERNEL_LOCALVERSION" \
               INSTALL_MOD_PATH="$PWD/stage/modules-root" modules_install

      - name: 打包产物并算校验和
        run: |
          set -e
          V=$(cat include/config/kernel.release)
          echo "built version = $V"
          mkdir -p stage/kernel
          cp arch/arm64/boot/Image stage/kernel/zImage      # Armbian 的 uEnv 用 LINUX=/zImage，arm64 上就是 Image 改名
          cp arch/arm64/boot/dts/amlogic/meson-g12a-s905l3a-m401a.dtb stage/kernel/ 2>/dev/null || true
          cp .config stage/kernel/config-"$V"
          echo "$V" > stage/kernel/VERSION
          tar -C stage -cf naoyun-kernel-artifact.tar kernel modules-root
          sha256sum naoyun-kernel-artifact.tar | tee naoyun-kernel-artifact.sha256
          ls -l naoyun-kernel-artifact.tar

      - uses: actions/upload-artifact@v4
        with:
          name: naoyun-kernel-${{ github.run_number }}
          path: |
            naoyun-kernel-artifact.tar
            naoyun-kernel-artifact.sha256
          if-no-files-found: error
